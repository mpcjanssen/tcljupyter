[project]
name = "tcljupyter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mark Janssen", email = "mpc.janssen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter-kernel-test>=0.7.0",
    "jupyterlab>=4.6.5",
]

[dependency-groups]
dev = [
    "jupyter_kernel_test>=0.5.2",
    "pytest>=8.0",
]

[project.scripts]
tcljupyter = "tcljupyter:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
