services:
  tcljupyter:
    container_name: tcljupyter
    image: mpcjanssen/tcljupyter:x86_64
    environment:
      - TCLLIBPATH=/home/tcljupyter/tcl/lib
    ports:
      - 127.0.0.1:7005:8888
    volumes:
      - notebooks:/home/tcljupyter/notebooks
      - config:/home/tcljupyter/config
      - tcl:/home/tcljupyter/tcl
    restart: unless-stopped
volumes:
  config:
  tcl:
  notebooks:

